name: Daybook
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DaybookPlatform:
    path: Packages/DaybookPlatform
  WeatherFeature:
    path: Packages/WeatherFeature
targets:
  Daybook:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DaybookPlatform
      - package: WeatherFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Shows the weather where you are right now.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.replicantstudio.daybook
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: KTS29DB5CZ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DaybookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Daybook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.replicantstudio.daybook.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Daybook
schemes:
  Daybook:
    build:
      targets:
        Daybook: all
        DaybookUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DaybookUITests
    archive:
      config: Release
