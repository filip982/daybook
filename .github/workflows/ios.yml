name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
    paths:
      - "ios/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -version | grep "Xcode 26.6"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Prepare simulator
        run: scripts/ensure-simulator.sh 'platform=iOS Simulator,name=iPhone 17,OS=26.5'

      - name: Lint
        run: make lint

      - name: Test scripts
        run: make scripts-test

      - name: Test packages
        run: make ios-test

      - name: Build app
        run: make ios-build

      - name: Verify bundle
        run: make ios-verify-bundle

      - name: UI test
        run: make ios-ui-test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: ios/build/UITests.xcresult
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the build number is a commit count and the tag must be an ancestor of origin/main.
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -version | grep "Xcode 26.6"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Resolve version and build number
        env:
          TAG: ${{ github.ref_name }}
        run: |
          info="$(scripts/release-info.sh "$TAG" origin/main)"
          echo "$info"
          echo "$info" >> "$GITHUB_ENV"

      - name: Archive
        run: make ios-archive ios-verify-archive VERSION="${VERSION:?}" BUILD="${BUILD:?}"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          make ios-upload ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
